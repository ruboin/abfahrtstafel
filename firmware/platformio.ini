; Firmware for the GeekMagic SmallTV Pro (classic ESP32, 8 MB flash, 240x240 ST7789).
; Build:   pio run          -> .pio/build/smalltv_pro/firmware.bin
; Install: upload firmware.bin at http://<device-ip>/update (stock web UI or this firmware)

[env:smalltv_pro]
; Official platform with Arduino core 2.0.17 (much smaller install than pioarduino/core 3.x)
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
; Same layout as the stock firmware, so the stock /update page accepts our image
board_build.partitions = partitions_smalltv_pro.csv
monitor_speed = 115200
build_flags =
    -D ARDUINOJSON_USE_DOUBLE=0
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    moononournation/GFX Library for Arduino@1.4.9  ; last series for Arduino core 2.x
    olikraus/U8g2@^2.35.0
